<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <!-- Blue gradient squircle background -->
    <defs>
        <linearGradient id="favGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop stop-color="#2563EB"/>
            <stop offset="1" stop-color="#1D4ED8"/>
        </linearGradient>
    </defs>
    <rect width="64" height="64" rx="14" fill="url(#favGrad)"/>
    
    <!-- Smooth Circular Rebound Orbit / Turnaround Loop -->
    <path d="M32 9C19.2975 9 9 19.2975 9 32C9 44.7025 19.2975 55 32 55C43.6811 55 53.3039 46.3687 54.8569 35" 
