        <path d="M32 14C30.8 14 30 15.2 30 16.8V28L16 36V40.4L30 35.6V46.4L25 50V53L32 51L39 53V50L34 46.4V35.6L48 40.4V36L34 28V16.8C34 15.2 33.2 14 32 14Z" 
